[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rowray"
version = "0.2.0"
description = "Compare dbt model data and scan cost against a Git base ref"
readme = "README.md"
authors = [{ name = "Mathieu Rozé" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "google-cloud-bigquery>=3,<4",
  "pyyaml>=6,<7",
]

[project.scripts]
rowray = "rowray.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rowray"]

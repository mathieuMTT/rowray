name: Test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
      - run: uv run --locked python -m unittest discover -s tests -v

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dbt: [v1, v2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
      - run: uv sync --locked
      - run: uv run --locked scripts/dbt-compat setup ${{ matrix.dbt }}
      - run: echo "$GITHUB_WORKSPACE/.sandbox/venvs/${{ matrix.dbt }}/bin" >> "$GITHUB_PATH"
      - run: uv run --locked python -m unittest tests.test_dbt_compat -v
        env:
          DBT_VERSION_CHECK: "false"
          ROWRAY_DBT_COMPAT: ${{ matrix.dbt }}
